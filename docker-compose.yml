version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/lakehouse --ignore-existing;
      mc anonymous set public myminio/lakehouse;
      mc mb myminio/mlflow --ignore-existing;
      mc anonymous set public myminio/mlflow;
      "

  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "19120:19120"

  kafka:
    image: apache/kafka:3.7.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

  create-topic:
    image: apache/kafka:3.7.1
    container_name: create-topic
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c "
      until /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092; do echo waiting for kafka; sleep 2; done;
      /opt/kafka/bin/kafka-topics.sh --create --bootstrap-server kafka:9092 --topic fraud-transactions --partitions 1 --replication-factor 1 --if-not-exists;
      "

  # --- MLflow & ML Model ---

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root s3://mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      - minio

  model-trainer:
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    container_name: model-trainer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: ["python", "train.py"]
    depends_on:
      - mlflow
      - minio-setup

  model-serving:
    build:
      context: ./ml-model
      dockerfile: Dockerfile
    container_name: model-serving
    ports:
      - "5001:5001"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MODEL_NAME: fraud-detector
    command: ["python", "serve.py"]
    depends_on:
      - mlflow
      - model-trainer

  # --- Data Pipeline ---

  fraud-producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-producer
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
    depends_on:
      - kafka
      - create-topic
    command: ["java", "-cp", "/app/app.jar", "com.lakehouse.FraudDataProducer"]

  fraud-streaming:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-streaming
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - NESSIE_URI=http://nessie:19120/api/v2
      - MINIO_ENDPOINT=http://minio:9000
      - MODEL_SERVING_URL=http://model-serving:5001/predict
    depends_on:
      - kafka
      - minio
      - nessie
      - model-serving
    command: ["java", "-cp", "/app/app.jar", "com.lakehouse.LakehouseStreaming"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  trino:
    image: trinodb/trino:435
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - minio
      - nessie

volumes:
  minio_data:
  mlflow_data:
